name: LabSerial Setup WinForms Windows x64 (experimental)
on:
  push:
    branches:
      - feature/portus-virtual-serial-phase1
    paths:
      - 'virtual-serial/standalone-driver/manager/**'
      - 'virtual-serial/standalone-driver/physical/*LabSerial*.ps1'
      - 'virtual-serial/standalone-driver/physical/LabSerialNativeProbe.cs'
      - '.github/workflows/labserial-setup-windows.yml'
  pull_request:
    paths:
      - 'virtual-serial/standalone-driver/manager/**'
      - 'virtual-serial/standalone-driver/physical/*LabSerial*.ps1'
      - 'virtual-serial/standalone-driver/physical/LabSerialNativeProbe.cs'
      - '.github/workflows/labserial-setup-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  winforms-manager:
    name: Compile WinForms, package EXE and Inno installer (no driver install)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate original diagnostic scripts and profile script syntax
        run: |
          $base = 'virtual-serial/standalone-driver'
          & powershell.exe -NoProfile -NonInteractive -File "$base/physical/Run-LabSerialEvidenceBounded.ps1" -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Native supervisor selftest failed' }
          & powershell.exe -NoProfile -NonInteractive -File "$base/physical/Run-LabSerialCompatibilityBounded.ps1" -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'SerialPort supervisor selftest failed' }
          $source = "$base/manager/Run-LabSerialProfileProbe.ps1"
          $tokens = $null; $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path -LiteralPath $source).Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { throw "Profile probe PowerShell parser error: $($parseErrors[0].Message)" }
          Write-Host 'All PowerShell scripts passed parser and watchdog self-tests.'
      - name: Compile Release WinForms
        run: |
          dotnet build "virtual-serial/standalone-driver/manager/LabSerial.Setup.csproj" --configuration Release --nologo -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'WinForms build failed' }
      - name: Publish self-contained portable win-x64
        run: |
          $root = "virtual-serial/standalone-driver/manager"
          dotnet publish "$root/LabSerial.Setup.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o "$root/publish" --nologo
          if ($LASTEXITCODE -ne 0) { throw 'WinForms publish failed' }
          $output = "$root/publish"
          foreach ($path in @(
            'LabSerial.Setup.exe',
            'Scripts/Run-LabSerialProfileProbe.ps1',
            'Scripts/Run-LabSerialEvidenceBounded.ps1',
            'Scripts/Evidence-LabSerialTransfer.ps1',
            'Scripts/Run-LabSerialCompatibilityBounded.ps1',
            'Scripts/Test-LabSerialSerialPort.ps1',
            'Scripts/LabSerialNativeProbe.cs')) {
            if (-not (Test-Path -LiteralPath (Join-Path $output $path) -PathType Leaf)) {
              throw "Published app missing required file: $path"
            }
          }
          $checks = [ordered]@{
            product = 'LabSerial Setup'
            type = 'Experimental WinForms user-mode manager (NO DRIVER)'
            build = $env:GITHUB_SHA
            production_approved = $false
            driver_installed = $false
            ui_physically_tested = $false
            files = [ordered]@{}
          }
          foreach ($f in @(Get-ChildItem -Path $output -Recurse -File)) {
            $rel = [IO.Path]::GetRelativePath((Resolve-Path $output).Path, $f.FullName).Replace('\','/')
            $checks.files[$rel] = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash
          }
          $checks | ConvertTo-Json -Depth 8 | Out-File (Join-Path $output 'build-manifest.json') -Encoding utf8
          Compress-Archive -Path "$output/*" -DestinationPath "LabSerial-Setup-Portable-Windows-x64-Experimental.zip" -Force
      - name: Build experimental Inno Setup installer
        run: |
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
            $iscc = @(
              'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
              'C:\Program Files\Inno Setup 6\ISCC.exe'
            ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe was not found' }
          & $iscc "virtual-serial/standalone-driver/manager/LabSerialSetup.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installer compilation failed' }
          $installer = "virtual-serial/standalone-driver/manager/dist/LabSerial-Setup-Windows-x64-Experimental.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'Installer EXE missing' }
          Get-FileHash -LiteralPath $installer -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: labserial-setup-winforms-windows-x64-test-only
          path: |
            LabSerial-Setup-Portable-Windows-x64-Experimental.zip
            virtual-serial/standalone-driver/manager/dist/LabSerial-Setup-Windows-x64-Experimental.exe
          if-no-files-found: error
          retention-days: 15
