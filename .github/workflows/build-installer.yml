name: Build instalável (Windows)

# Valida testes e gera o instalável NSIS (.exe) a cada PR, garantindo que
# a versão empacotada passou pela suíte automatizada antes de ser publicada.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

# Cancela builds antigos do mesmo PR quando novos commits chegam.
concurrency:
  group: build-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: testes + npm run package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Definir versão única para publicação da main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/prepare-release-version.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Instalar dependências
        run: npm ci

      - name: Validar TypeScript
        run: npm run typecheck

      - name: Rodar testes
        run: npm test

      - name: Validar requisitos da versão
        run: npm run validate:release

      - name: Gerar instalável
        run: npm run package
        env:
          # Build não assinado: sem certificado, evita prompts/erros de assinatura.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verificar DB Utility empacotado no instalador
        shell: pwsh
        run: |
          $utility = "release/win-unpacked/resources/database/portus-db-utility.ps1"
          if (-not (Test-Path -LiteralPath $utility -PathType Leaf)) {
            throw "DB Utility nao foi incluido no pacote Windows: $utility"
          }
          Write-Host "DB Utility presente no pacote Windows."
          $output = & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File $utility -SmokeTest -LaunchedFromPortus 2>&1
          $output | Write-Host
          if ($LASTEXITCODE -ne 0 -or "$output" -notmatch "PORTUS_DB_UTILITY_READY" -or "$output" -notmatch "PORTUS_DB_UTILITY_SMOKE_OK") {
            throw "DB Utility empacotado nao conseguiu abrir a janela WinForms."
          }

      - name: Validar atualização de arquivos sem executar instalador
        run: node tests/windows/file-update.mjs

      - name: Preservar evidências da atualização de arquivos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portus-file-update-${{ github.run_id }}
          path: test-results/file-update/
          if-no-files-found: warn

      - name: Publicar instalável como artifact
        uses: actions/upload-artifact@v4
        with:
          name: portus-installer-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || format('main-{0}', github.sha) }}
          path: |
            release/*.exe
            release/PORTUS-Update-*.zip
            release/*.exe.blockmap
            release/latest.yml
            release-version.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publicar atualização validada
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish-release.yml
    with:
      artifact_name: portus-installer-main-${{ github.sha }}
