name: PORTUS Virtual Serial groundwork

on:
  pull_request:
    paths:
      - "virtual-serial/**"
      - ".github/workflows/portus-virtual-serial-core.yml"
  push:
    branches: [main]
    paths:
      - "virtual-serial/**"
      - ".github/workflows/portus-virtual-serial-core.yml"

permissions:
  contents: read

jobs:
  test-core:
    name: FIFO and C++ core / ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S virtual-serial -B virtual-serial/build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - name: Build C and C++ tests
        run: cmake --build virtual-serial/build --config ${{ matrix.configuration }}
      - name: Test portable driver FIFO and C++ core
        run: ctest --test-dir virtual-serial/build -C ${{ matrix.configuration }} --output-on-failure --repeat until-fail:3

  test-sanitizers:
    name: Native FIFO and C++ core / ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizers
        run: cmake -S virtual-serial -B virtual-serial/build-sanitized -DCMAKE_BUILD_TYPE=Debug -DLABSERIAL_ENABLE_SANITIZERS=ON
      - name: Build sanitized tests
        run: cmake --build virtual-serial/build-sanitized --config Debug
      - name: Run with sanitizers
        run: ctest --test-dir virtual-serial/build-sanitized -C Debug --output-on-failure

  test-python:
    name: Python simulators, contracts and release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: |
          python -m unittest discover -s virtual-serial/simulator -p 'test_*.py' -v
          python -m unittest discover -s virtual-serial/tests -p 'test_release_gate.py' -v
          python -m unittest discover -s virtual-serial/standalone-driver/tests -p 'test_*.py' -v
      - name: Non-production gate must reject missing evidence
        shell: bash
        run: |
          set +e
          python virtual-serial/scripts/release_gate.py --manifest virtual-serial/standalone-driver/release/labserial-evidence.example.json > gate.json
          code=$?
          set -e
          cat gate.json
          test "$code" -eq 1
          python -c "import json; x=json.load(open('gate.json')); assert x['ready_for_human_review'] is False and len(x['blockers']) >= 12"
