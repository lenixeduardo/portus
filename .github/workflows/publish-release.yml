name: Publicar atualização Windows

# Reuses the installer that passed the Windows build, tests and utility smoke test.
# Publication stays inside the caller's serialized main workflow.
on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: artifact
      - name: Publicar e validar instalador no canal de atualização
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = Get-Content 'artifact/release-version.json' | ConvertFrom-Json
          $version = $metadata.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Versao invalida' }
          if ($metadata.commit -ne $env:GITHUB_SHA) { throw 'Artifact pertence a outro commit' }
          $tag = "v$version"
          $name = "PORTUS-Setup-$version-x64.exe"
          $installer = "artifact/release/$name"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Instalador ausente: $installer" }
          $packageName = "PORTUS-Update-$version-x64.zip"
          $package = "artifact/release/$packageName"
          if (-not (Test-Path -LiteralPath $package)) { throw "Pacote ausente: $package" }
          # Stage the release as draft so the updater never sees an incomplete upload.
          gh release create $tag $installer $package --draft --target $env:GITHUB_SHA --title "PORTUS $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao enviar instalador; nenhuma Release existente foi sobrescrita' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a Release preparada' }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $latest.tag_name -ne $tag) { throw 'Canal latest nao corresponde a versao publicada' }
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$name"
          if (-not ($latest.assets | Where-Object { $_.name -eq $name -and $_.browser_download_url -eq $url -and $_.size -gt 0 })) {
            throw 'O instalador esperado nao foi localizado na Release publicada'
          }
          $packageAsset = $latest.assets | Where-Object { $_.name -eq $packageName -and $_.size -gt 0 -and $_.digest -match '^sha256:[a-f0-9]{64}$' }
          if (-not $packageAsset) { throw 'Pacote ou digest SHA256 ausente na Release' }
          "PORTUS $version disponivel em $($latest.html_url)" >> $env:GITHUB_STEP_SUMMARY
