name: Publicar atualização Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portus-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validar versão
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Versão inválida' }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag e package.json devem ter a mesma versão' }
          "PORTUS_RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:release
      # Do not run prepackage: a release must preserve the committed version.
      - name: Gerar instalador
        run: npm run build && npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Publicar instalador
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "release/PORTUS-Setup-$version-x64.exe"
          if (!(Test-Path $installer)) { throw 'Instalador não encontrado' }
          gh release create $env:PORTUS_RELEASE_TAG $installer --target $env:GITHUB_SHA --title "PORTUS $version" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar versão; verifique se ela já existe' }
