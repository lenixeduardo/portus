name: LabSerial WDK experimental compile

on:
  pull_request:
    paths:
      - "virtual-serial/standalone-driver/**"
      - ".github/workflows/labserial-wdk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-kmdf:
    name: KMDF x64 / ${{ matrix.configuration }} / INF and signature checks (no install)
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: virtual-serial/standalone-driver/packages
          key: labserial-wdk-nuget-28000-2526-x64-v1
      - name: Restore official WDK NuGet packages
        shell: pwsh
        run: nuget restore .\virtual-serial\standalone-driver\packages.config -PackagesDirectory .\virtual-serial\standalone-driver\packages
      - name: Locate native x64 WDK tools
        shell: pwsh
        run: |
          $root = ".\virtual-serial\standalone-driver\packages"
          foreach ($exe in @("stampinf.exe", "inf2cat.exe", "infverif.exe", "signtool.exe")) {
            $found = @(Get-ChildItem -LiteralPath $root -Recurse -Filter $exe -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
              Select-Object -First 1)
            if ($exe -eq "stampinf.exe" -and $found.Count -eq 0) { throw "x64 stampinf.exe not found" }
            if ($found.Count -gt 0) {
              Write-Host "Found $exe at $($found[0].FullName)"
              $found[0].DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            }
          }
      - name: Add 64-bit MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build KMDF Windows driver (no loading or installation)
        shell: pwsh
        run: |
          msbuild .\virtual-serial\standalone-driver\kmdf\labserial.vcxproj /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "WDK build failed" }
      - name: Verify INF, SYS and test catalog
        shell: pwsh
        run: |
          $base = "virtual-serial/standalone-driver/kmdf/x64/${{ matrix.configuration }}"
          $sys = Join-Path $base "labserial.sys"
          $inf = Join-Path $base "labserial.inf"
          $cat = Join-Path $base "labserial/labserial.cat"
          foreach ($file in @($sys, $inf, $cat)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing generated file: $file" }
            if ((Get-Item -LiteralPath $file).Length -le 0) { throw "Empty generated file: $file" }
          }
          $body = Get-Content -Raw -LiteralPath $inf
          foreach ($id in @("ROOT\LABSERIAL_VCOM_A", "ROOT\LABSERIAL_VCOM_B")) {
            if (-not $body.Contains($id)) { throw "INF missing hardware ID: $id" }
          }
          & infverif.exe /w /v $inf
          if ($LASTEXITCODE -ne 0) { throw "InfVerif /w rejected generated INF" }
          $signature = Get-AuthenticodeSignature -LiteralPath $sys
          if ($null -eq $signature.SignerCertificate) { throw "Driver SYS has no signing certificate" }
          Write-Host "TEST certificate: $($signature.SignerCertificate.Subject)"
          Write-Host "Signature status: $($signature.Status) (not proof of production trust)"
          $output = "labserial-test-package/${{ matrix.configuration }}"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          foreach ($file in @($sys, $inf, $cat)) { Copy-Item -LiteralPath $file -Destination $output }
          # Export only PUBLIC certificate bytes. No private key leaves the runner.
          $testCert = Join-Path $output 'labserial-test.cer'
          [IO.File]::WriteAllBytes((Join-Path (Get-Location) $testCert),
              $signature.SignerCertificate.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          $roundTrip = [Security.Cryptography.X509Certificates.X509Certificate2]::new((Join-Path (Get-Location) $testCert))
          if ($roundTrip.Thumbprint -ne $signature.SignerCertificate.Thumbprint) {
            throw "Public test certificate mismatch"
          }
          $physical = "virtual-serial/standalone-driver/physical"
          $scripts = @(
            'Inspect-LabSerialHost.ps1',
            'Inspect-LabSerialPorts.ps1',
            'Install-LabSerialTest.ps1',
            'Trust-LabSerialTestCertificate.ps1',
            'Test-LabSerialPorts.ps1',
            'Remove-LabSerialTest.ps1',
            'Run-LabSerialSmokeBounded.ps1',
            'Run-LabSerialEvidenceBounded.ps1',
            'Evidence-LabSerialTransfer.ps1'
          )
          foreach ($script in $scripts) {
            $src = Join-Path $physical $script
            if (-not (Test-Path -LiteralPath $src -PathType Leaf)) { throw "Required script missing: $src" }
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $src).Path,
              [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell syntax invalid in $src : $($errors[0].Message)" }
            Copy-Item -LiteralPath $src -Destination $output
          }
          $native = Join-Path $physical 'LabSerialNativeProbe.cs'
          Add-Type -Path (Resolve-Path $native).Path -ErrorAction Stop
          if (-not ('LabSerialNativeProbe' -as [type])) { throw 'Native COM probe type not loaded' }
          Copy-Item -LiteralPath $native -Destination $output
          $extras = @('README-PHYSICAL-TEST.txt', 'LabSerial-Instalador-Teste.bat',
            'Teste-Transmissao-LabSerial.bat')
          foreach ($name in $extras) {
            $src = Join-Path $physical $name
            if (-not (Test-Path -LiteralPath $src -PathType Leaf)) { throw "Required file missing: $src" }
            Copy-Item -LiteralPath $src -Destination $output
          }
          $scriptHash = [ordered]@{}
          foreach ($name in ($scripts + @('LabSerialNativeProbe.cs') + $extras)) {
            $scriptHash[$name] = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $output $name)).Hash
          }
          # Fail-closed check in CI host that has no LabSerial PnP devices.
          if ("${{ matrix.configuration }}" -eq "Release") {
            $noDevicePath = Join-Path $env:RUNNER_TEMP 'labserial-empty-windows-evidence'
            & powershell.exe -NoProfile -File (Join-Path $output 'Evidence-LabSerialTransfer.ps1') -OutputDirectory $noDevicePath
            if ($LASTEXITCODE -ne 1) { throw 'CI host unexpectedly accepted COM without LabSerial PnP verification.' }
            $evidence = @(Get-ChildItem -LiteralPath $noDevicePath -Filter *.json -File)
            if ($evidence.Count -ne 1) { throw 'Expected exactly one negative evidence JSON' }
            $negative = Get-Content -LiteralPath $evidence[0].FullName -Raw | ConvertFrom-Json
            if ($negative.Result -ne 'FAIL' -or $negative.RequestedTransfer) { throw 'Fail-closed check failed.' }
          }
          $manifest = [ordered]@{
            product = "LabSerial"
            architecture = "x64"
            configuration = "${{ matrix.configuration }}"
            driver_model = "KMDF"
            driver_installed = $false
            kernel_runtime_tested = $false
            intended_for_production = $false
            physical_windows_loaded = $false
            release_approved = $false
            scripts_sha256 = $scriptHash
            source_commit = "$env:GITHUB_SHA"
            test_signing_certificate_thumbprint = $roundTrip.Thumbprint
            sha256 = [ordered]@{
              sys = (Get-FileHash -Algorithm SHA256 -LiteralPath $sys).Hash
              inf = (Get-FileHash -Algorithm SHA256 -LiteralPath $inf).Hash
              cat = (Get-FileHash -Algorithm SHA256 -LiteralPath $cat).Hash
              cer = (Get-FileHash -Algorithm SHA256 -LiteralPath $testCert).Hash
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -LiteralPath (Join-Path $output "checksums.json") -Encoding utf8
      - name: Archive test-only package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: labserial-wdk-${{ matrix.configuration }}-x64-test-only
          path: labserial-test-package/${{ matrix.configuration }}/*
          retention-days: 7
      - name: Archive standalone evidence toolset (no driver installation)
        if: success() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: labserial-transfer-evidence-tools
          path: |
            labserial-test-package/Release/Evidence-LabSerialTransfer.ps1
            labserial-test-package/Release/LabSerialNativeProbe.cs
            labserial-test-package/Release/Run-LabSerialEvidenceBounded.ps1
            labserial-test-package/Release/Teste-Transmissao-LabSerial.bat
          retention-days: 7
      - name: Archive diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: labserial-wdk-${{ matrix.configuration }}-diagnostics
          path: virtual-serial/standalone-driver/kmdf/x64/${{ matrix.configuration }}/**
          retention-days: 3
          if-no-files-found: ignore
