name: LabSerial WDK experimental compile

on:
  pull_request:
    paths:
      - "virtual-serial/standalone-driver/**"
      - ".github/workflows/labserial-wdk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-kmdf:
    name: WDK compile (no install)
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore official WDK NuGet packages
        shell: pwsh
        run: nuget restore .\virtual-serial\standalone-driver\packages.config -PackagesDirectory .\virtual-serial\standalone-driver\packages
      - name: Locate WDK executables
        shell: pwsh
        run: |
          $root = ".\\virtual-serial\\standalone-driver\\packages"
          $stampinf = @(Get-ChildItem -LiteralPath $root -Recurse -Filter stampinf.exe -File -ErrorAction SilentlyContinue | Select-Object -First 1)
          if ($stampinf.Count -eq 0) {
            throw "WDK package restored, but stampinf.exe was not found under $root"
          }
          $tools = @("stampinf.exe", "inf2cat.exe", "infverif.exe", "signtool.exe")
          foreach ($exe in $tools) {
            $found = @(Get-ChildItem -LiteralPath $root -Recurse -Filter $exe -File -ErrorAction SilentlyContinue | Select-Object -First 1)
            if ($found.Count -gt 0) {
              $directory = $found[0].DirectoryName
              Write-Host "Found $exe at $directory"
              $directory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            }
          }
      - name: Add MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Compile KMDF experimental driver
        shell: pwsh
        run: |
          msbuild .\virtual-serial\standalone-driver\kmdf\labserial.vcxproj /m /p:Configuration=Debug /p:Platform=x64 /v:minimal
      - name: Save diagnostic build log and generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labserial-wdk-experimental
          path: |
            virtual-serial/standalone-driver/kmdf/x64/**
            virtual-serial/standalone-driver/kmdf/Debug/**
          retention-days: 3
