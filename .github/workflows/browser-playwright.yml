name: Browser visual validation (Playwright)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install Playwright Chromium and OS dependencies
        run: npx playwright-core install --with-deps chromium
      - name: Run browser visual tests
        run: npm run test:browser
      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portus-playwright-screenshots
          path: test-results/browser/
          if-no-files-found: ignore
          retention-days: 14
