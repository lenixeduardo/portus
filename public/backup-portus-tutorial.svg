<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="760" viewBox="0 0 1530 760"><rect width="1530" height="760" fill="#071723"/><text x="42" y="66" font-family="Arial,sans-serif" font-size="42" font-weight="bold" fill="#00D7B5">PORTUS</text><text x="275" y="66" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#ffffff">Como criar um backup completo</text><text x="42" y="112" font-family="Arial,sans-serif" font-size="20" fill="#b9cedb">Guia de navegação — Configurações → DB Utility → Backup completo</text><g font-family="Arial,sans-serif"><rect x="40" y="145" width="704" height="150" rx="16" fill="#102533" stroke="#305465"/><circle cx="85" cy="193" r="27" fill="#00D7B5"/><text x="85" y="201" text-anchor="middle" fill="#06242a" font-size="24" font-weight="bold">01</text><text x="131" y="198" font-size="27" font-weight="bold" fill="#fff">Abra o PORTUS</text><text x="131" y="245" font-size="18" fill="#c5d5df">Inicie o aplicativo e entre com sua conta Master.</text><rect x="780" y="145" width="704" height="150" rx="16" fill="#102533" stroke="#305465"/><circle cx="825" cy="193" r="27" fill="#00D7B5"/><text x="825" y="201" text-anchor="middle" fill="#06242a" font-size="24" font-weight="bold">02</text><text x="871" y="198" font-size="27" font-weight="bold" fill="#fff">Acesse Configurações</text><text x="871" y="245" font-size="18" fill="#c5d5df">Na barra lateral, selecione Configurações.</text><rect x="40" y="317" width="704" height="150" rx="16" fill="#102533" stroke="#305465"/><circle cx="85" cy="365" r="27" fill="#00D7B5"/><text x="85" y="373" text-anchor="middle" fill="#06242a" font-size="24" font-weight="bold">03</text><text x="131" y="370" font-size="27" font-weight="bold" fill="#fff">Abra o DB Utility</text><text x="131" y="417" font-size="18" fill="#c5d5df">Localize a ferramenta de banco de dados.</text><rect x="780" y="317" width="704" height="150" rx="16" fill="#102533" stroke="#305465"/><circle cx="825" cy="365" r="27" fill="#00D7B5"/><text x="825" y="373" text-anchor="middle" fill="#06242a" font-size="24" font-weight="bold">04</text><text x="871" y="370" font-size="27" font-weight="bold" fill="#fff">Backup completo</text><text x="871" y="417" font-size="18" fill="#c5d5df">Na janela do DB Utility, clique em Backup completo.</text><rect x="40" y="489" width="704" height="150" rx="16" fill="#102533" stroke="#305465"/><circle cx="85" cy="537" r="27" fill="#00D7B5"/><text x="85" y="545" text-anchor="middle" fill="#06242a" font-size="24" font-weight="bold">05</text><text x="131" y="542" font-size="27" font-weight="bold" fill="#fff">Formato e destino</text><text x="131" y="589" font-size="18" fill="#c5d5df">Escolha JSON, .dump, .sql ou .tar e o local do arquivo.</text><rect x="780" y="489" width="704" height="150" rx="16" fill="#102533" stroke="#305465"/><circle cx="825" cy="537" r="27" fill="#00D7B5"/><text x="825" y="545" text-anchor="middle" fill="#06242a" font-size="24" font-weight="bold">06</text><text x="871" y="542" font-size="27" font-weight="bold" fill="#fff">Confirme no log</text><text x="871" y="589" font-size="18" fill="#c5d5df">Aguarde a mensagem de conclusão da exportação.</text></g><text x="42" y="719" font-family="Arial,sans-serif" font-size="19" fill="#00D7B5">Recomendação: use .dump para restauração PostgreSQL e mantenha cópias em local seguro.</text></svg>